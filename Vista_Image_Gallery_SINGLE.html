<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vista — Image Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--paper:#f8f7f3;--ink:#252923;--muted:#777b71;--line:#e6e4dc;--green:#66775b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.topbar{height:76px;padding:0 7.5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{color:var(--ink);text-decoration:none;font-size:23px;font-weight:700;letter-spacing:-1px;display:flex;align-items:center;gap:8px}
.brand-mark{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--green);color:white;font-family:Georgia,serif;font-size:19px}
.brand-dot{color:var(--green);margin-left:-8px}.top-note{color:var(--muted);font-size:12px}
.container{width:min(1120px,85%);margin:0 auto}.intro{padding:68px 0 43px}
.eyebrow{color:var(--green);font-size:10px;font-weight:700;letter-spacing:2.5px;margin:0 0 15px}
h1{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:clamp(38px,5vw,62px);line-height:1.1;font-weight:500;letter-spacing:-1.8px}
h1 em{color:var(--green);font-weight:500}.subtitle{margin:17px 0 0;color:var(--muted);font-size:14px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:25px}
.filters{display:flex;flex-wrap:wrap;gap:8px}.filter{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:30px;padding:9px 14px;font-size:12px;transition:.2s}
.filter:hover{border-color:var(--line);color:var(--ink)}.filter.active{background:var(--ink);color:white}.filter span{font-size:10px;margin-left:5px;opacity:.7}
.search{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--line);border-radius:30px;padding:9px 13px;min-width:190px;color:var(--muted)}
.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:12px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.photo-card{min-width:0}
.photo-open{position:relative;display:block;width:100%;height:290px;overflow:hidden;border:0;padding:0;border-radius:4px;background:#e6e4dc;text-align:left}
.photo-open img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .55s ease}.photo-open:hover img{transform:scale(1.055)}
.image-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;padding:22px;color:white;background:linear-gradient(transparent 35%,rgba(20,25,20,.72));opacity:0;transition:opacity .25s}
.photo-open:hover .image-overlay,.photo-open:focus-visible .image-overlay{opacity:1}.image-overlay small{font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.image-overlay b{font-family:'Playfair Display',Georgia,serif;font-size:23px;font-weight:500}
.empty-state{grid-column:1/-1;color:var(--muted);text-align:center;padding:50px 0}
.footer{display:flex;justify-content:space-between;gap:20px;padding:35px 0 28px;margin-top:40px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:1.3px}
.footer span:last-child{letter-spacing:0;font-size:12px}
.lightbox{position:fixed;z-index:20;inset:0;display:none;align-items:center;justify-content:center;padding:55px 70px;background:rgba(18,21,18,.94)}
.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:78vh;object-fit:contain}
.lightbox-close,.lightbox-arrow{position:absolute;border:0;color:white;background:rgba(255,255,255,.12);border-radius:50%;width:43px;height:43px;font-size:29px;display:grid;place-items:center}
.lightbox-close{top:20px;right:22px}.lightbox-arrow{top:50%;transform:translateY(-50%);font-size:36px}.lightbox-arrow.prev{left:18px}.lightbox-arrow.next{right:18px}
.lightbox-caption{position:absolute;bottom:20px;left:0;right:0;color:white;text-align:center;font-family:'Playfair Display',Georgia,serif;font-size:20px}
[hidden]{display:none!important}
@media(max-width:760px){.topbar{height:65px;padding:0 6%}.top-note{font-size:10px}.container{width:88%}.intro{padding:48px 0 32px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo-open{height:235px}.image-overlay{opacity:1;padding:13px}.image-overlay b{font-size:18px}.footer{flex-direction:column}.lightbox{padding:50px 20px}}
@media(max-width:420px){.top-note{display:none}.gallery{grid-template-columns:1fr}.photo-open{height:280px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="brand-mark">V</span> vista<span class="brand-dot">.</span></a>
  <span class="top-note">A little inspiration, collected.</span>
</header>
<main class="container">
  <section class="intro">
    <p class="eyebrow">A VISUAL JOURNAL</p>
    <h1>Find your <em>beautiful.</em></h1>
    <p class="subtitle">Little moments. Lovely places. A world worth noticing.</p>
  </section>
  <section class="toolbar">
    <div class="filters">
      <button class="filter active" data-filter="all">All photos <span>06</span></button>
      <button class="filter" data-filter="nature">Nature</button>
      <button class="filter" data-filter="architecture">Architecture</button>
      <button class="filter" data-filter="travel">Travel</button>
    </div>
    <label class="search">⌕ <input id="searchInput" type="search" placeholder="Search photos..." aria-label="Search photos"></label>
  </section>
  <section class="gallery" id="gallery">
    <article class="photo-card" data-category="nature" data-title="Golden meadow"><button class="photo-open" aria-label="Open Golden meadow"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1000&q=85" alt="Golden sunlight over a meadow"><span class="image-overlay"><small>Nature</small><b>Golden meadow ↗</b></span></button></article>
    <article class="photo-card" data-category="architecture" data-title="Quiet geometry"><button class="photo-open" aria-label="Open Quiet geometry"><img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1000&q=85" alt="Modern architectural lines"><span class="image-overlay"><small>Architecture</small><b>Quiet geometry ↗</b></span></button></article>
    <article class="photo-card" data-category="travel" data-title="Coastal escape"><button class="photo-open" aria-label="Open Coastal escape"><img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1000&q=85" alt="Blue ocean waves"><span class="image-overlay"><small>Travel</small><b>Coastal escape ↗</b></span></button></article>
    <article class="photo-card" data-category="nature" data-title="Into the woods"><button class="photo-open" aria-label="Open Into the woods"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=85" alt="Sunlight filtering through forest trees"><span class="image-overlay"><small>Nature</small><b>Into the woods ↗</b></span></button></article>
    <article class="photo-card" data-category="architecture" data-title="City patterns"><button class="photo-open" aria-label="Open City patterns"><img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=1000&q=85" alt="City buildings"><span class="image-overlay"><small>Architecture</small><b>City patterns ↗</b></span></button></article>
    <article class="photo-card" data-category="travel" data-title="Mountain air"><button class="photo-open" aria-label="Open Mountain air"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=85" alt="Mountain peaks beneath the sky"><span class="image-overlay"><small>Travel</small><b>Mountain air ↗</b></span></button></article>
    <p class="empty-state" id="emptyState" hidden>No photos found. Try another search.</p>
  </section>
  <footer class="footer"><span>VISTA PHOTO JOURNAL</span><span>Collect moments, not things.</span></footer>
</main>
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="closeLightbox" aria-label="Close photo">×</button>
  <button class="lightbox-arrow prev" id="prevPhoto" aria-label="Previous photo">‹</button>
  <img id="lightboxImage" alt=""><div class="lightbox-caption" id="lightboxCaption"></div>
  <button class="lightbox-arrow next" id="nextPhoto" aria-label="Next photo">›</button>
</div>
<script>
const cards = [...document.querySelectorAll('.photo-card')];
const filters = [...document.querySelectorAll('.filter')];
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
let activeFilter = 'all';
function updateGallery() {
  const query = searchInput.value.trim().toLowerCase();
  let shown = 0;
  cards.forEach(card => {
    const matchesCategory = activeFilter === 'all' || card.dataset.category === activeFilter;
    const matchesSearch = card.dataset.title.toLowerCase().includes(query) || card.dataset.category.includes(query);
    const visible = matchesCategory && matchesSearch;
    card.hidden = !visible;
    if (visible) shown++;
  });
  emptyState.hidden = shown !== 0;
}
filters.forEach(button => button.addEventListener('click', () => {
  activeFilter = button.dataset.filter;
  filters.forEach(item => item.classList.toggle('active', item === button));
  updateGallery();
}));
searchInput.addEventListener('input', updateGallery);

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');
const lightboxCaption = document.getElementById('lightboxCaption');
let currentIndex = 0;
function openLightbox(index) {
  currentIndex = index;
  const card = cards[currentIndex];
  const img = card.querySelector('img');
  lightboxImage.src = img.src;
  lightboxImage.alt = img.alt;
  lightboxCaption.textContent = card.dataset.title;
  lightbox.classList.add('open');
  lightbox.setAttribute('aria-hidden', 'false');
}
function closeLightbox() {
  lightbox.classList.remove('open');
  lightbox.setAttribute('aria-hidden', 'true');
}
cards.forEach((card, index) => card.querySelector('.photo-open').addEventListener('click', () => openLightbox(index)));
document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
document.getElementById('prevPhoto').addEventListener('click', () => openLightbox((currentIndex - 1 + cards.length) % cards.length));
document.getElementById('nextPhoto').addEventListener('click', () => openLightbox((currentIndex + 1) % cards.length));
lightbox.addEventListener('click', event => { if (event.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeLightbox();
  if (event.key === 'ArrowLeft' && lightbox.classList.contains('open')) openLightbox((currentIndex - 1 + cards.length) % cards.length);
  if (event.key === 'ArrowRight' && lightbox.classList.contains('open')) openLightbox((currentIndex + 1) % cards.length);
});
</script>
</body>
</html>
